<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DocBench — PDF & File Toolkit{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">DB</span>
      <span class="brand-name">DocBench</span>
    </a>
    <span class="tagline">a workbench for PDFs, docs & images</span>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>DocBench — self-hosted document toolkit. Files are processed in-memory and never stored.</p>
    <p>&copy; 2026 Anshul Bhilare. All Rights Reserved.</p>
</footer>
</body>
</html>
